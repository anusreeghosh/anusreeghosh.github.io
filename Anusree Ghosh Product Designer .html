<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Anusree Ghosh — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6efdf; --ink:#26241f; --muted:#7a705c;
  --peach:#f3c79a; --lav:#cdc3ef; --sky:#b9d7ec; --rose:#f1bccb; --mint:#b3d59b;
  --paper:#fffdf6; --edge:rgba(70,52,20,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-weight:400;
  font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,48px)}
.clock{font-size:18px;letter-spacing:.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.clock small{font-size:12px;color:var(--muted);letter-spacing:.08em}
.portfolio{color:#f6efdf;background:#26241f;text-decoration:none;font-size:15px;padding:10px 20px;
  border-radius:999px;transition:transform .2s,background .2s}
.portfolio:hover{transform:translateY(-2px);background:#000}
main{padding:56px 24px 48px;overflow:hidden}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0 0 30px;max-height:24px;overflow:hidden;transition:opacity .3s,max-height .5s,margin .5s}
.hint.gone{opacity:0;max-height:0;margin:0}
.stack{position:relative;width:min(560px,100%);height:640px;margin:0 auto}

.folder{position:absolute;left:0;right:0;top:var(--t);height:420px;background:var(--c);
  border:1px solid var(--edge);border-radius:20px;cursor:pointer;outline:none;
  transform:rotate(var(--r,0deg));transform-origin:50% 100%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 12px 24px rgba(80,55,20,.2);
  transition:transform .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.tab{position:absolute;top:-34px;left:var(--tl);height:35px;padding:0 22px;line-height:34px;
  background:var(--c);border:1px solid var(--edge);border-bottom:0;border-radius:20px 20px 0 0;
  font-size:15px;color:var(--ink);white-space:nowrap}
.folder:not(.open):hover,.folder:focus-visible{transform:translateY(-12px) rotate(var(--r,0deg))}

.cover{--c:var(--mint);--t:300px;--r:-.5deg;height:340px;z-index:10;
  padding:0 32px 36px;display:flex;flex-direction:column;justify-content:flex-end}
.cover h1{margin:0 0 28px;font-weight:400;font-size:clamp(38px,9.5vw,60px);line-height:1;letter-spacing:-.035em}
.offer{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.15}
.offer i{flex:1;height:1px;background:var(--ink);opacity:.7}

/* open state: others slide away, folder sits low, cards pop out */
.has-open .folder:not(.open){transform:translateY(760px) rotate(var(--r,0deg));opacity:0;pointer-events:none}
.folder.open{--t:565px;--r:0deg;z-index:30;cursor:default}
.info{position:absolute;left:0;top:20px;right:90px;opacity:0;pointer-events:none;transition:opacity .3s}
.info.show{opacity:1;transition-delay:.35s}
.info h2{margin:0 0 8px;font-weight:400;font-size:clamp(30px,7vw,40px);letter-spacing:-.03em;line-height:1}
.info p{margin:0;font-size:15px;line-height:1.4;color:var(--muted);max-width:38ch}
.back{position:absolute;right:0;top:22px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);
  font:400 14px 'Inter Tight',system-ui,sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.has-open .back{opacity:1;pointer-events:auto;transition-delay:.35s}

.card{position:absolute;z-index:25;left:var(--x);top:var(--y);width:min(220px,52%);min-height:130px;
  background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:16px 18px;
  color:var(--ink);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 14px 26px rgba(80,55,20,.2);
  opacity:0;pointer-events:none;transform:translateY(300px) rotate(0deg);
  transition:transform .7s cubic-bezier(.2,.9,.25,1.05) var(--d),opacity .3s var(--d)}
.card.show{opacity:1;pointer-events:auto;transform:translateY(0) rotate(var(--cr))}
a.card:hover{transform:translateY(-8px) rotate(var(--cr));transition-delay:0s}
.card b{font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.card span{font-size:14px;color:var(--muted)}
.card.note{background:#fbf3c9}
.card.note span{color:var(--ink);line-height:1.5}
.card.photo{width:min(190px,46%);min-height:0;padding:10px 10px 8px;justify-content:flex-start;gap:8px}
.card.photo img{width:100%;aspect-ratio:1/1.05;object-fit:cover;display:block;border-radius:3px;background:#ddd}
.card.photo span{font-family:'Caveat','Bradley Hand','Segoe Script',cursive;font-size:28px;line-height:1;color:var(--ink);padding:0 2px 2px}
.card.about{width:min(240px,52%);justify-content:flex-start;gap:10px}
.card.about p{margin:0;font-size:15px;line-height:1.4}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 18px 28px}
@media (max-width:480px){.cover{padding:0 22px 32px}.tab{padding:0 16px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.folder,.card,.info{transition:none}}
</style>
</head>

</header>

// live clock (India time). Change the timeZone to show visitors' own time: remove the timeZone option.
var fmt = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
var timeEl = document.getElementById('time');
function tick(){ timeEl.textContent = fmt.format(new Date()); }
tick(); setInterval(tick, 1000);

var SLOTS = [{x:'4%',y:215,r:-7},{x:'46%',y:250,r:6},{x:'24%',y:330,r:-2}];
var FOLDERS = [
  {id:'work', label:'Work', color:'var(--peach)', top:20, tab:'62%', rot:-1.3,
   title:'Selected work', text:'Case studies and projects, from research to final screens.',
   cards:[{t:'Case studies', s:'See all projects →', u:LINKS.work},
          {t:'Portfolio', s:'Visit the home page →', u:LINKS.portfolio},
          {note:true, s:'UI/UX<br>Product design<br>Case studies'}]},
  {id:'cv', label:'CV', color:'var(--lav)', top:85, tab:'30%', rot:1,
   title:'My CV', text:'A quick look at my experience, skills and education.',
   cards:[{t:'Resume', s:'Open on Drive →', u:LINKS.cv},
          {note:true, s:'Experience<br>Skills<br>Education'}]},
  {id:'linkedin', label:'LinkedIn', color:'var(--sky)', top:150, tab:'8%', rot:-.8,
   title:'Let’s connect', text:'Say hi, follow my work or reach out for opportunities.',
   cards:[{t:'LinkedIn', s:'Connect with me →', u:LINKS.linkedin},
          {note:true, s:'Updates<br>Opportunities<br>Say hello'}]},
  {id:'fun', label:'For fun', color:'var(--rose)', top:215, tab:'42%', rot:1.2,
   title:'For fun', text:'Side projects, experiments and creative explorations.',
   cards:[{t:'For fun', s:'Explore more →', u:LINKS.play},
          {note:true, s:'Experiments<br>Freelance<br>Explorations'}]}
];
// the front (green) folder: about me
var ABOUT = {id:'about', top:300, rot:-.5,
  title:'About me', text:'Always exploring. Always experimenting.',
  slots:[{x:'6%',y:205,r:-6},{x:'47%',y:235,r:5}],
  cards:[{photo:true, s:'aneez'},
         {about:true, t:'Hi, I’m Anusree',
          l1:'Product designer turning messy problems into simple, intuitive journeys.',
          l2:'Into UX research, thoughtful UI details and AI-assisted design.'}]};

var stack = document.getElementById('stack'), back = document.getElementById('back');
var current = null;

function setOpen(f, on){
  f.el.classList.toggle('open', on);
  f.el.style.setProperty('--t', on ? '565px' : f.top + 'px');
  f.el.style.setProperty('--r', on ? '0deg' : f.rot + 'deg');
  f.info.classList.toggle('show', on);
  f.cards.forEach(function(c){ c.classList.toggle('show', on); });
  stack.classList.toggle('has-open', on);
  current = on ? f : null;
  document.querySelector('.hint').classList.toggle('gone', on);
  setTimeout(function(){
    var top = 0;
    if(on){ top = window.scrollY + stack.getBoundingClientRect().top + 280 - window.innerHeight / 2; }
    window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
  }, 520);
}

function wire(f){
  var info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = '<h2>' + f.title + '</h2><p>' + f.text + '</p>';
  stack.appendChild(info); f.info = info;

  f.cards = f.cards.map(function(c, i){
    var s = (f.slots || SLOTS)[i], n = document.createElement(c.u ? 'a' : 'div');
    n.className = 'card' + (c.note ? ' note' : '') + (c.photo ? ' photo' : '') + (c.about ? ' about' : '');
    if(c.u){ n.href = c.u; n.target = '_blank'; n.rel = 'noopener'; }
    n.style.setProperty('--x', s.x); n.style.setProperty('--y', s.y + 'px');
    n.style.setProperty('--cr', s.r + 'deg'); n.style.setProperty('--d', (0.25 + i * .12) + 's');
    if(c.photo){
      n.innerHTML = '<img src="' + FACE + '" alt="Black and white close-up portrait of Anusree"><span>' + c.s + '</span>';
    } else if(c.about){
      n.innerHTML = '<b>' + c.t + '</b><p>' + c.l1 + '</p><p>' + c.l2 + '</p>';
    } else {
      n.innerHTML = (c.t ? '<b>' + c.t + '</b>' : '') + '<span>' + c.s + '</span>';
    }
    stack.appendChild(n);
    return n;
  });

  function open(){ if(!current) setOpen(f, true); }
  f.el.addEventListener('click', open);
  f.el.addEventListener('keydown', function(e){
    if(e.target === f.el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); open(); }
  });
}

FOLDERS.forEach(function(f){
  var el = document.createElement('div');
  el.className = 'folder';
  el.setAttribute('role','button'); el.setAttribute('tabindex','0');
  el.setAttribute('aria-label','Open ' + f.label + ' folder');
  el.style.setProperty('--c', f.color);
  el.style.setProperty('--t', f.top + 'px');
  el.style.setProperty('--tl', f.tab);
  el.style.setProperty('--r', f.rot + 'deg');
  el.innerHTML = '<span class="tab">' + f.label + '</span>';
  stack.appendChild(el);
  f.el = el;
  wire(f);
});

var cover = document.createElement('div');
cover.className = 'folder cover';
cover.setAttribute('role','button'); cover.setAttribute('tabindex','0');
cover.setAttribute('aria-label','Open About me folder');
cover.innerHTML = '<span class="tab" style="--tl:7%">Product Design</span>' +
  '<h1>I’m a<br>Product<br>Designer</h1>' +
  '<div class="offer"><span>What I can<br>offer you</span><i></i></div>';
stack.appendChild(cover);
ABOUT.el = cover;
wire(ABOUT);

back.addEventListener('click', function(){ if(current) setOpen(current, false); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && current) setOpen(current, false); });
</script>
